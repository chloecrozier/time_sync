<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeSync - Poll</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <div class="theme-toggle" id="themeToggle">
                    <span class="theme-icon">●</span>
                </div>
            </div>
            <h1 class="title">TimeSync</h1>
            <p class="subtitle">時を重ねる</p>
        </header>

        <div class="main-content">
            <!-- Poll Display Section -->
            <div class="poll-display" id="pollDisplay">
                <div class="section-header">
                    <h2 id="pollTitleDisplay"></h2>
                    <div class="action-buttons">
                        <div class="share-dropdown">
                            <button class="action-btn" id="shareBtn">Share Poll</button>
                            <div class="share-menu" id="shareMenu">
                                <button class="share-option" id="copyUrlBtn">
                                    <span class="share-icon">⧉</span>
                                    Copy Link
                                </button>
                                <button class="share-option" id="showQRBtn">
                                    <span class="share-icon">⊞</span>
                                    QR Code
                                </button>
                                <button class="share-option" id="shareTextBtn">
                                    <span class="share-icon">⊡</span>
                                    Copy Message
                                </button>
                                <button class="share-option" id="exportIcsBtn">
                                    <span class="share-icon">⊟</span>
                                    Export Calendar
                                </button>
                            </div>
                        </div>
                        <button class="action-btn secondary" id="copyCalendarBtn">Copy Schedule</button>
                    </div>
                </div>
                <div class="timezone-info">
                    <span id="currentTimezone"></span>
                </div>

                <div class="time-range-group">
                    <div class="form-group">
                        <label for="startTime">Start Time</label>
                        <select id="startTime"></select>
                    </div>
                    <div class="form-group">
                        <label for="endTime">End Time</label>
                        <select id="endTime"></select>
                    </div>
                    <button class="update-time-btn" id="updateTimeBtn">Update Schedule</button>
                </div>

                <div class="user-input-section">
                    <div class="form-group">
                        <label for="userName">Your Name</label>
                        <input type="text" id="userName" placeholder="Enter your name to start marking availability" maxlength="50" required aria-describedby="userNameHelp" />
                        <div id="userNameHelp" class="sr-only">Enter your name to start marking your availability on the schedule</div>
                        <button id="addUserBtn" type="button">Start Marking</button>
                    </div>
                    <p class="instruction-text">After clicking "Start Marking", click on time slots below to mark when you're available</p>
                </div>

                <div class="availability-grid-container">
                    <div class="grid-header">
                        <div class="time-column-header">Time</div>
                        <div class="days-header" id="daysHeader"></div>
                    </div>
                    <div class="availability-grid" id="availabilityGrid" role="grid" aria-label="Availability schedule - click and drag to mark your availability"></div>
                </div>

                <div class="suggestions-section" id="suggestionsSection" style="display: none;">
                    <h3>Suggested Times</h3>
                    <div class="suggestions-list" id="suggestionsList"></div>
                </div>

                <div class="participants-section">
                    <h3>Participants</h3>
                    <div class="participants-list" id="participantsList"></div>
                </div>

                <button class="new-poll-btn" id="newPollBtn">Create New Poll</button>
            </div>
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
