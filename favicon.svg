<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .clock-element {
        stroke: #333;
        fill: #333;
      }
      @media (prefers-color-scheme: dark) {
        .clock-element {
          stroke: #fff;
          fill: #fff;
        }
      }
    </style>
  </defs>
  
  <!-- Outer circle with minimal Japanese style -->
  <circle cx="16" cy="16" r="13" fill="none" stroke-width="1" class="clock-element"/>
  
  <!-- Simple hour markers at 12, 3, 6, 9 -->
  <line x1="16" y1="4" x2="16" y2="6" stroke-width="1" class="clock-element"/>
  <line x1="28" y1="16" x2="26" y2="16" stroke-width="1" class="clock-element"/>
  <line x1="16" y1="28" x2="16" y2="26" stroke-width="1" class="clock-element"/>
  <line x1="4" y1="16" x2="6" y2="16" stroke-width="1" class="clock-element"/>
  
  <!-- Clock hands in minimalist style -->
  <!-- Hour hand pointing to 10 -->
  <line x1="16" y1="16" x2="12" y2="9" stroke-width="2" stroke-linecap="round" class="clock-element"/>
  <!-- Minute hand pointing to 2 (10:10 position) -->
  <line x1="16" y1="16" x2="22" y2="9" stroke-width="1.5" stroke-linecap="round" class="clock-element"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1" class="clock-element"/>
</svg>