<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeSync - Create a new Poll</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <div class="theme-toggle" id="themeToggle">
                    <span class="theme-icon">●</span>
                </div>
            </div>
            <h1 class="title">TimeSync</h1>
            <p class="subtitle">時を重ねる</p>
        </header>

        <div class="main-content">
            <!-- Poll Creation Section -->
            <div class="poll-creator" id="pollCreator">
                <div class="section-header">
                    <h2>Create New Availability Poll</h2>
                    <p>Select days and time range for your scheduling poll</p>
                </div>

                <div class="form-group">
                    <label for="pollTitle">Poll Title</label>
                    <input type="text" id="pollTitle" placeholder="e.g., Team Meeting This Week" maxlength="100" required aria-describedby="pollTitleHelp" />
                    <div id="pollTitleHelp" class="sr-only">Enter a descriptive title for your scheduling poll</div>
                </div>

                <div class="form-group">
                    <label>Schedule Type</label>
                    <div class="schedule-type-selector">
                        <button class="type-btn active" id="generalDaysBtn">General Days</button>
                        <button class="type-btn" id="specificDatesBtn">Specific Dates</button>
                    </div>
                </div>

                <div class="form-group" id="generalDaysGroup">
                    <label>Select Days</label>
                    <div class="days-selector" role="group" aria-label="Select days of the week">
                        <button class="day-btn" data-day="0" type="button" aria-pressed="false">Sun</button>
                        <button class="day-btn" data-day="1" type="button" aria-pressed="false">Mon</button>
                        <button class="day-btn" data-day="2" type="button" aria-pressed="false">Tue</button>
                        <button class="day-btn" data-day="3" type="button" aria-pressed="false">Wed</button>
                        <button class="day-btn" data-day="4" type="button" aria-pressed="false">Thu</button>
                        <button class="day-btn" data-day="5" type="button" aria-pressed="false">Fri</button>
                        <button class="day-btn" data-day="6" type="button" aria-pressed="false">Sat</button>
                    </div>
                </div>

                <div class="form-group" id="specificDatesGroup" style="display: none;">
                    <label>Select Date Range (Max 7 days)</label>
                    <div class="date-range-group">
                        <div class="date-input-group">
                            <label for="startDate">Start Date</label>
                            <input type="date" id="startDate" />
                        </div>
                        <div class="date-input-group">
                            <label for="endDate">End Date</label>
                            <input type="date" id="endDate" />
                        </div>
                        <button class="today-btn" id="todayBtn" type="button">Today</button>
                    </div>
                    <div class="selected-dates" id="selectedDates"></div>
                </div>

                <div class="creator-timezone">
                    <span class="timezone-label">Your timezone:</span>
                    <span id="creatorTimezone"></span>
                </div>

                <div class="time-range-group">
                    <div class="form-group">
                        <label for="startTime">Start Time</label>
                        <select id="startTime"></select>
                    </div>
                    <div class="form-group">
                        <label for="endTime">End Time</label>
                        <select id="endTime"></select>
                    </div>
                </div>

                <button class="create-poll-btn" id="createPollBtn">Create Poll</button>
            </div>
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
